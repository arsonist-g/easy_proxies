services:
  # ──────────────────────────────────────────────────────────────
  # 一次性初始化容器：在主容器启动前确保 nodes.txt / easy.db 以
  # "文件"形式存在于宿主机。
  # 原因：Docker 对"不存在的宿主机路径"做单文件 bind mount 时会自动
  # 把它创建为目录，导致容器内对应路径变成目录而启动失败
  # （bbolt 无法把目录当数据库文件打开；应用层 store.Open 也会兜底）。
  # 复用主镜像（无需额外镜像/版本），以 root 运行一次后退出。
  # ──────────────────────────────────────────────────────────────
  ensure-files:
    image: ghcr.io/arsonist-g/easy_proxies:latest
    container_name: easy-proxies-ensure-files
    user: "0:0"
    restart: "no"
    volumes:
      - ./:/work
    working_dir: /work
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for f in nodes.txt easy.db; do
          if [ -d "$$f" ]; then rm -rf "$$f"; fi
          if [ ! -e "$$f" ]; then touch "$$f"; fi
          chmod 666 "$$f" || true
        done
        echo "ensure-files: nodes.txt / easy.db ready"

  easy-proxies:
    image: ghcr.io/arsonist-g/easy_proxies:latest
    container_name: easy-proxies
    restart: unless-stopped
    depends_on:
      ensure-files:
        condition: service_completed_successfully
    # 方式一：使用主机网络模式（推荐，支持端口自动重分配）
    network_mode: host
    # 方式二：手动映射端口（注释掉 network_mode，启用下面的 ports）
    # ports:
    #   # Pool 模式入口（pool/hybrid 模式使用）
    #   - "2323:2323"
    #   # Web 监控面板
    #   - "9091:9091"
    #   # Multi-port 端口范围（multi-port/hybrid 模式使用，根据节点数量调整）
    #   - "24000-24200:24000-24200"
    #
    # 支持的运行模式（在 config.yaml 中配置）：
    #   - pool: 单端口代理池，所有节点共享 2323 端口
    #   - multi-port: 多端口模式，每个节点独立端口
    #   - hybrid: 混合模式，同时启用 pool (2323) + multi-port (24000+)
    #
    # hybrid 模式说明：
    #   - 代理池入口：http://0.0.0.0:2323（自动负载均衡）
    #   - 独立节点入口：http://0.0.0.0:24000, 24001, ...（直连特定节点）
    #   - 节点状态在两种入口间共享（黑名单同步）
    #   - 端口冲突时自动重分配到下一个可用端口
    volumes:
      # 配置文件需要可写权限以支持 WebUI 设置保存
      # 如遇权限问题，请在宿主机执行: chmod 666 config.yaml nodes.txt
      - ./config.yaml:/etc/easy-proxies/config.yaml
      - ./nodes.txt:/etc/easy-proxies/nodes.txt
      # bbolt 存储文件（订阅/API Key/订阅token/探测结果持久化）
      # 由上方 ensure-files 容器在启动前自动创建为空文件（避免 Docker 把
      # 缺失的单文件 bind mount 创建成目录）；应用层 store.Open 亦会兜底。
      - ./easy.db:/etc/easy-proxies/easy.db
