<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>节点概览 · Easy Proxies</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="dashboard">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <button class="btn btn-secondary btn-sm mobile-toggle" onclick="toggleSidebar()">☰</button>
        <h1 style="display:inline">节点概览</h1>
        <div class="sub" id="dash-sub">节点池总览</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary btn-sm" id="dash-refresh">↻ 刷新</button>
        <button class="btn btn-primary btn-sm" id="dash-probe">探测全部</button>
      </div>
    </div>
    <!-- P8 全节点探测进度条（探测中显示 x/y，完成隐藏） -->
    <div class="probe-progress hidden" id="probe-progress">
      <span class="pp-label"></span>
      <div class="pp-track"><div class="pp-fill"></div></div>
      <span class="pp-num"></span>
    </div>
    <div class="stats" id="dash-stats"></div>
    <div class="charts" id="dash-charts"></div>
    <div class="summary-row" id="dash-summary"></div>
  </main>
</div>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/modal.js"></script>
<script src="/assets/js/pagination.js"></script>
<script src="/assets/js/pages/dashboard.js"></script>
</body>
</html>
