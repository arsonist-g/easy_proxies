  * { margin:0; padding:0; box-sizing:border-box; }

  /* ===== MASTER tokens (Modern Tech Dark) ===== */
  :root {
    --bg:#0a0a0a; --surface:#141414; --surface-2:#1c1c1c; --surface-3:#262626;
    --border:#262626; --border-strong:#404040;
    --text-primary:#ededed; --text-secondary:#a3a3a3; --text-tertiary:#525252;
    --primary:#3b82f6; --primary-hover:#2563eb; --accent:#06b6d4;
    --success:#10b981; --warning:#f59e0b; --error:#ef4444;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-md:0 4px 12px rgba(0,0,0,0.5);
    --shadow-lg:0 12px 32px rgba(0,0,0,0.6);
    --glow-focus:0 0 0 3px rgba(59,130,246,0.25);
    --font-sans:"Inter",system-ui,-apple-system,sans-serif;
    --font-mono:"JetBrains Mono","SF Mono",Menlo,monospace;
    --radius:8px; --radius-sm:4px;
  }

  body { font-family:var(--font-sans); background:var(--bg); color:var(--text-primary);
         line-height:1.5; font-size:14px; font-variant-numeric:tabular-nums;
         -webkit-font-smoothing:antialiased; }
  /* 全局自定义滚动条（适配暗色主题，覆盖浏览器默认浅色样式） */
  * { scrollbar-width:thin; scrollbar-color:var(--surface-3) transparent; }
  *::-webkit-scrollbar { width:10px; height:10px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background-color:var(--surface-3); border-radius:var(--radius-sm);
    border:2px solid transparent; background-clip:padding-box; }
  *::-webkit-scrollbar-thumb:hover { background-color:var(--border-strong); }
  *::-webkit-scrollbar-corner { background:transparent; }

  /* ===== Layout ===== */
  .shell { display:flex; min-height:100vh; }
  .sidebar { width:220px; flex-shrink:0; background:var(--bg); border-right:1px solid var(--border);
    padding:20px 12px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:10px; padding:8px 10px 20px; }
  .brand-logo { width:28px; height:28px; border-radius:var(--radius); background:var(--primary);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;
    box-shadow:0 0 12px rgba(59,130,246,0.4); }
  .brand-name { font-size:14px; font-weight:600; letter-spacing:-0.01em; }
  .nav-section { font-size:11px; font-weight:600; color:var(--text-tertiary); text-transform:uppercase;
    letter-spacing:0.08em; padding:16px 10px 6px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius);
    color:var(--text-secondary); cursor:pointer; font-size:13px; font-weight:500;
    transition:background .15s, color .15s; }
  .nav-item:hover { background:var(--surface-2); color:var(--text-primary); }
  .nav-item.active { background:var(--surface-3); color:var(--text-primary); }
  .nav-item.active .ic { color:var(--primary); }
  .nav-item .ic { width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; color:var(--text-tertiary); flex-shrink:0; }
  .nav-item .ic svg { width:16px; height:16px; display:block; }
  .nav-spacer { flex:1; }
  .nav-status { display:flex; align-items:center; gap:8px; padding:10px; font-size:12px;
    color:var(--text-secondary); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .nav-logout { margin-top:8px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--success); box-shadow:0 0 6px var(--success); }
  .dot.warn { background:var(--warning); box-shadow:0 0 6px var(--warning); }

  .main { flex:1; min-width:0; padding:28px 36px 60px; }
  .page-head { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; gap:12px; flex-wrap:wrap; }
  .page-head h1 { font-size:24px; font-weight:700; letter-spacing:-0.02em; }
  .page-head .sub { font-size:12px; color:var(--text-secondary); margin-top:4px; }
  .page-actions { display:flex; gap:8px; }

  /* ===== Buttons (统一 8px) ===== */
  .btn { padding:8px 16px; border:1px solid transparent; border-radius:var(--radius); font-size:13px;
    font-weight:500; font-family:var(--font-sans); cursor:pointer;
    transition:background .15s, border-color .15s, box-shadow .15s;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-hover); }
  .btn-primary:focus-visible { box-shadow:var(--glow-focus); outline:none; }
  .btn-secondary { background:var(--surface-2); color:var(--text-primary); border:1px solid var(--border); }
  .btn-secondary:hover { background:var(--surface-3); border-color:var(--border-strong); }
  .btn-secondary:focus-visible { box-shadow:var(--glow-focus); outline:none; }
  .btn-sm { padding:5px 10px; font-size:12px; }
  .btn-danger { background:transparent; color:var(--error); border:1px solid var(--border); }
  .btn-danger:hover { background:rgba(239,68,68,0.1); border-color:var(--error); }

  /* ===== Cards / surfaces ===== */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:24px; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
  .stat-label { font-size:12px; color:var(--text-secondary); margin-bottom:8px; font-weight:500; }
  .stat-value { font-size:30px; font-weight:700; letter-spacing:-0.02em; line-height:1; }
  .stat-sub { font-size:11px; color:var(--text-tertiary); margin-top:6px; }

  /* ===== Tables ===== */
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; }
  /* 凭证分页：多页时固定表格区最小高度（约 20 行），避免翻到末页行数少导致整框骤缩跳变 */
  #apikeys-table .table-wrap.paginated, #subtokens-table .table-wrap.paginated { min-height:760px; }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  /* 节点表固定列宽：table-layout:fixed 使列宽恒定，不随每页内容长度重算（翻页不再抖动）；
     name 列定宽+ellipsis 截断超长节点名，hover title 看全名（缩短元素而非挪开）；
     td overflow:hidden 兜底，防止任何单元格内容溢出到邻列。 */
  table.tbl-fixed { table-layout:fixed; }
  .tbl-fixed td { overflow:hidden; }
  .tbl-fixed .node-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 实际 IP：可点击复制，IPv6 较长时 ellipsis 截断、hover title 看全 */
  .copyable-ip { display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom; cursor:pointer; }
  .copyable-ip:hover { color:var(--primary); }
  thead th { text-align:left; padding:10px 14px; font-size:11px; font-weight:600;
    color:var(--text-secondary); letter-spacing:0.04em; text-transform:uppercase;
    border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; }
  thead th:first-child { border-top-left-radius:var(--radius); }
  thead th:last-child { border-top-right-radius:var(--radius); }
  thead th.th-active { color:var(--primary); }
  tbody td { padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody tr:last-child td { border-bottom:none; }
  tbody td:first-child { position:relative; }
  tbody tr.status-ok td:first-child::before,
  tbody tr.status-warn td:first-child::before,
  tbody tr.status-err td:first-child::before,
  tbody tr.status-black td:first-child::before {
    content:''; position:absolute; left:0; top:33%; bottom:33%; width:3px; border-radius:99px; }
  tbody tr.status-ok td:first-child::before { background:var(--success); }
  tbody tr.status-warn td:first-child::before { background:var(--warning); }
  tbody tr.status-err td:first-child::before { background:var(--error); }
  tbody tr.status-black td:first-child::before { background:var(--text-tertiary); }
  tbody tr:hover { background:var(--surface-2); }

  /* ===== Badges / country ===== */
  .badge { padding:3px 8px; border-radius:var(--radius); font-size:11px; font-weight:600; display:inline-flex;
    align-items:center; gap:4px; border:1px solid transparent; }
  .badge-ok { background:rgba(16,185,129,0.12); color:var(--success); border-color:rgba(16,185,129,0.25); }
  .badge-warn { background:rgba(245,158,11,0.12); color:var(--warning); border-color:rgba(245,158,11,0.25); }
  .badge-err { background:rgba(239,68,68,0.12); color:var(--error); border-color:rgba(239,68,68,0.25); }
  .badge-neutral { background:var(--surface-3); color:var(--text-secondary); border-color:var(--border); }
  .country { display:inline-flex; align-items:center; gap:6px; }
  .flag { font-family:"Twemoji Country Flags","Apple Color Emoji","Segoe UI Emoji"; }
  .country .flag { font-size:14px; }
  .country .code { font-family:var(--font-sans); font-size:12px; color:var(--text-secondary); }
  .mono { font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); }
  .asn-cell { display:inline-block; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }

  /* availability bar */
  .avail { display:flex; align-items:center; gap:8px; }
  .avail-bar { width:56px; height:5px; background:var(--surface-3); border-radius:var(--radius-sm); overflow:hidden; }
  .avail-fill { height:100%; border-radius:var(--radius-sm); }
  .avail-num { font-size:12px; color:var(--text-secondary); width:34px; }

  /* ===== Filter bar ===== */
  .filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .input, .select { padding:7px 10px; border:1px solid var(--border-strong); border-radius:var(--radius);
    font-size:13px; font-family:var(--font-sans); background:var(--surface-3); color:var(--text-primary); }
  .input:focus, .select:focus { outline:none; border-color:var(--primary); box-shadow:var(--glow-focus); }
  .input.mono { font-family:var(--font-mono); font-size:12px; }
  .input::placeholder { color:var(--text-tertiary); }
  .pagination { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-top:14px;
    font-size:12px; color:var(--text-secondary); }
  .pager { display:flex; gap:4px; }

  /* ===== Forms / modal ===== */
  .form-row { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .form-row label { font-size:12px; font-weight:500; color:var(--text-secondary); }
  .form-hint { font-size:11px; color:var(--text-tertiary); }
  .form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .scope-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .scope-chip { display:flex; align-items:center; gap:5px; padding:5px 10px; border:1px solid var(--border-strong);
    border-radius:var(--radius); font-size:12px; cursor:pointer; background:var(--surface-3); }
  .scope-chip input { margin:0; }

<script>
"use strict";
const API = '/api/v1';

/* ===== 工具函数 ===== */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function flag(cc){ if(!cc || cc.length !== 2) return ''; try { return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)); } catch(e){ return ''; } }
function short(s, n){ s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function fmtTime(t){ if(!t) return '—'; const d = new Date(t); if(isNaN(d)) return '—'; return d.toLocaleTimeString('zh-CN', {hour12:false}); }
function fmtNum(n){ const v = Number(n||0); if(v >= 1000) return (v/1000).toFixed(1)+'k'; return String(v); }

/* ===== API 封装 ===== */
async function api(path, { method='GET', body } = {}){
  const opts = { method, credentials:'same-origin', headers:{} };
  if(body !== undefined){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(API + path, opts); }
  catch(e){ const err = new Error('网络错误：'+e.message); err.status = 0; throw err; }
  const txt = await res.text();
  let data = null;
  if(txt){ try { data = JSON.parse(txt); } catch(e){} }
  if(!res.ok){
    const err = new Error((data && data.message) || ('HTTP '+res.status));
    err.status = res.status; err.code = data && data.code; err.body = data;
    throw err;
  }
  return data;
}

/* ===== Toast ===== */
function toast(msg, kind='ok'){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast '+kind;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, kind==='err'?5000:3000);
}

/* ===== Modal ===== */
function openModal(html, opts={}){
  const root = document.getElementById('modal-root');
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  const box = document.createElement('div');
  box.className = 'modal' + (opts.extraWide?' extra-wide':(opts.wide?' wide':''));
  box.innerHTML = html;
  back.appendChild(box);
  back.addEventListener('click', e => { if(e.target === back && !opts.sticky) closeModal(); });
  root.appendChild(back);
  return back;
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
function confirmModal(title, msg, onYes, yesLabel='确认'){
  openModal(`<h3>${esc(title)}</h3><div class="modal-sub">${esc(msg)}</div>
    <div class="form-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-danger btn-sm" id="cf-yes">${esc(yesLabel)}</button>
    </div>`);
  document.getElementById('cf-yes').onclick = () => { closeModal(); onYes(); };
}

/* ===== 鉴权 ===== */
const session = { authed:false, hasPassword:false };
async function checkAuth(){
  try { const s = await api('/auth/status'); session.authed = true; session.hasPassword = s.has_password; return true; }
  catch(e){ if(e.status === 401){ session.authed = false; return false; } throw e; }
}
function showLogin(){ document.getElementById('login-overlay').style.display='flex'; }
function hideLogin(){ document.getElementById('login-overlay').style.display='none'; }
async function doLogin(){
  const pwd = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const errBox = document.getElementById('login-error');
  errBox.style.display='none'; btn.disabled=true; btn.textContent='登录中…';
  try {
    const r = await api('/auth/login', { method:'POST', body:{ password:pwd } });
    session.authed = true; session.hasPassword = !(r && r.no_password);
    hideLogin(); await bootApp();
  } catch(e){
    errBox.textContent = e.message || '登录失败'; errBox.style.display='flex';
  } finally { btn.disabled=false; btn.textContent='登录'; }
}
async function doLogout(){
  try { await api('/auth/logout', { method:'POST' }); } catch(e){}
  session.authed = false;
  document.getElementById('logout-btn').style.display='none';
  showLogin();
}

const VIEW_LOADERS = {
  dashboard: loadDashboard, nodes: loadNodes, subs: loadSubs, pools: loadPools,

};
function switchView(name, anchor){
  viewAnchor = anchor || '';
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.nav === name));

}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

/* ===== Dashboard ===== */
async function loadDashboard(){
  const sub = document.getElementById('dash-sub');
  sub.textContent = '加载中…';
  let s;
  try { s = await api('/stats'); }
  catch(e){ renderDashError(e); return; }
  renderDashboard(s);
}
function renderDashError(e){
  document.getElementById('dash-stats').innerHTML = '';
  document.getElementById('dash-charts').innerHTML = '';
  document.getElementById('dash-summary').innerHTML = '';
  if(e.status === 401){ handle401(); return; }
  document.getElementById('dash-charts').innerHTML = `<div class="error-banner">⚠ ${esc(e.message)} <button class="btn btn-secondary btn-sm" onclick="loadDashboard()">重试</button></div>`;
}
function stateInline(msg){ return `<div class="state" style="padding:20px"><div class="desc">${esc(msg)}</div></div>`; }
function renderDashboard(s){
  const total = s.total_nodes||0, avail = s.available_nodes||0, dup = s.duplicate_nodes||0, subs = s.active_subscriptions||0;
  const rate = total ? Math.round(avail/total*1000)/10 : 0;
  document.getElementById('dash-sub').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN',{hour12:false});
  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">总节点</div><div class="stat-value">${total}</div><div class="stat-sub">订阅 + 手动</div></div>
    <div class="stat-card"><div class="stat-label">可用节点</div><div class="stat-value" style="color:var(--success)">${avail}</div><div class="stat-sub">可用率 ${rate}%</div></div>
    <div class="stat-card"><div class="stat-label">重复节点(已隐藏)</div><div class="stat-value">${dup}</div><div class="stat-sub">按落地 IP 去重</div></div>
    <div class="stat-card"><div class="stat-label">活跃订阅</div><div class="stat-value">${subs}</div><div class="stat-sub">订阅源</div></div>`;

  const ad = s.availability_distribution || {};
  const h = ad.high||0, m = ad.medium||0, l = ad.low||0;
  const tot = h+m+l || 1;
  const hEnd = (h/tot*100), mEnd = ((h+m)/tot*100);
  const donut = `conic-gradient(var(--primary) 0 ${hEnd}%, var(--success) ${hEnd}% ${mEnd}%, var(--warning) ${mEnd}% 100%)`;

  const cd = s.country_distribution || [];
  const cdMax = cd.reduce((mx,c) => Math.max(mx, c.count), 0) || 1;
  const cdHtml = cd.length ? cd.slice(0,6).map(c =>
    `<div class="bar-row"><div class="bar-label" title="${esc(c.country_name||c.country_code||'')}"><span class="flag">${flag(c.country_code)}</span> ${esc(c.country_name||c.country_code||'?')}</div><div class="bar-track"><div class="bar-fill" style="width:${c.count/cdMax*100}%"></div></div><div class="bar-val">${c.count}</div></div>`
  ).join('') : stateInline('尚无国家数据');

  const tc = (s.top_called_nodes||[]).filter(n => n.call_total > 0);
  const tcMax = tc.reduce((mx,n) => Math.max(mx, n.call_total), 0) || 1;
  const tcHtml = tc.length ? tc.slice(0,5).map(n =>
    `<div class="bar-row"><div class="bar-label">${esc(short(n.name,10))}</div><div class="bar-track"><div class="bar-fill" style="width:${n.call_total/tcMax*100}%"></div></div><div class="bar-val">${fmtNum(n.call_total)}</div></div>`
  ).join('') : stateInline('暂无调用数据（运行时计数，重启清零）');

  const ld = s.latency_distribution || {};
  const latRows = [
    ['<100ms', ld.lt100||0, 'var(--success)'], ['100-300', ld['100_300']||0, 'var(--success)'],
    ['300-500', ld['300_500']||0, 'var(--warning)'], ['>500ms', ld.gt500||0, 'var(--error)'],
    ['未知', ld.unknown||0, 'var(--text-tertiary)']
  ];
  const latMax = latRows.reduce((mx,r) => Math.max(mx, r[1]), 0) || 1;
  const latHtml = latRows.map(r =>
    `<div class="bar-row"><div class="bar-label">${r[0]}</div><div class="bar-track"><div class="bar-fill" style="width:${r[1]/latMax*100}%;background:${r[2]}"></div></div><div class="bar-val">${r[1]}</div></div>`
  ).join('');

  document.getElementById('dash-charts').innerHTML = `
    <div class="chart-card">
      <h3>可用率分布</h3>
      <div class="donut" style="background:${donut}"></div>
      <div class="donut-legend">
        <div><span class="legend-dot" style="background:var(--primary)"></span>高 (>90%) · ${h}</div>
        <div><span class="legend-dot" style="background:var(--success)"></span>中 (50-90%) · ${m}</div>
        <div><span class="legend-dot" style="background:var(--warning)"></span>低 (<50%) · ${l}</div>
      </div>
    </div>
    <div class="chart-card"><h3>国家分布</h3>${cdHtml}</div>
    <div class="chart-card"><h3>被调用 Top 5<span class="chart-note">运行时·重启清零</span></h3>${tcHtml}</div>
    <div class="chart-card"><h3>延迟分布</h3>${latHtml}</div>`;

  const sh = s.subscription_health || {};
  const shFailed = sh.failed||0;
  const shFailedNames = (sh.failed_names||[]).map(n => `<span class="mono">${esc(n)}</span>`).join('、') || '—';
  const als = s.alert_summary || {};
  const alertTotal = als.alert_count||0;
  const alertCritical = als.alert_critical||0;

  document.getElementById('dash-summary').innerHTML = `
    <div class="card summary-card">
      <div class="summary-head"><span class="summary-ic" style="color:${shFailed? 'var(--warning)':'var(--success)'}">${shFailed?'⚠':'✓'}</span> 订阅健康</div>
      <div class="summary-body">${shFailed ?
        `<span class="summary-num" style="color:var(--warning)">${shFailed}</span> 个订阅刷新失败：${shFailedNames}` :
        `<span class="summary-num" style="color:var(--success)">0</span> 全部订阅正常`}</div>
      <a class="summary-link" onclick="switchView('subs')">查看订阅 →</a>
    </div>
    <div class="card summary-card">
      <div class="summary-head"><span class="summary-ic" style="color:${alertTotal?'var(--error)':'var(--success)'}">${alertTotal?'⚠':'✓'}</span> 安全告警</div>
      <div class="summary-body">${alertTotal ?
        `<span class="summary-num" style="color:var(--error)">${alertTotal}</span> 项安全告警${alertCritical?`（${alertCritical} 项严重）`:''}` :
        `<span class="summary-num" style="color:var(--success)">0</span> 无安全告警`}</div>
      <a class="summary-link" onclick="switchView('alerts')">查看告警 →</a>
    </div>`;

  updateNavStatus(avail, total, shFailed || alertTotal);
}

/* ===== Nodes ===== */
const nodesState = { page:1, page_size:20, country:'', protocol:'', available:false, duplicate:false, name_regex:'', sort:'latency', dir:'asc' };
async function loadNodes(){
  const filterBar = document.getElementById('nodes-filter');
  if(!filterBar.dataset.built){
    filterBar.innerHTML = `
      <select class="select" id="f-country"><option value="">全部国家</option></select>
      <select class="select" id="f-protocol">
        <option value="">全部协议</option>
        <option value="vmess">vmess</option><option value="vless">vless</option>
        <option value="trojan">trojan</option><option value="ss">ss</option><option value="ssr">ssr</option>
        <option value="hysteria2">hysteria2</option>
      </select>
      <select class="select" id="f-status">
        <option value="">全部状态</option><option value="available">仅可用</option>
        <option value="duplicate">含重复</option>
      </select>
      <input class="input mono" id="f-regex" placeholder="name_regex 例: 日本|东京" style="flex:1;min-width:180px" />
      <button class="btn btn-secondary btn-sm" id="f-apply">筛选</button>`;
    filterBar.dataset.built = '1';
    document.getElementById('f-apply').onclick = () => {
      nodesState.page = 1;
      nodesState.country = document.getElementById('f-country').value;
      nodesState.protocol = document.getElementById('f-protocol').value;
      const st = document.getElementById('f-status').value;
      nodesState.available = (st === 'available');
      nodesState.duplicate = (st === 'duplicate');
      nodesState.name_regex = document.getElementById('f-regex').value.trim();
      loadNodes();
    };
  }
  const tbl = document.getElementById('nodes-table');
  tbl.innerHTML = skeletonTable(['节点','国家','ASN','协议','端口','延迟','可用率','状态','']);
  const q = new URLSearchParams();
  q.set('page', nodesState.page); q.set('page_size', nodesState.page_size);
  if(nodesState.country) q.set('country', nodesState.country);
  if(nodesState.protocol) q.set('protocol', nodesState.protocol);
  if(nodesState.available) q.set('available','true');
  if(nodesState.duplicate) q.set('duplicate','true');
  if(nodesState.name_regex) q.set('name_regex', nodesState.name_regex);
  q.set('sort', (nodesState.dir==='desc'?'-':'')+nodesState.sort);
  let data;
  try { data = await api('/nodes?'+q.toString()); }
  catch(e){
    if(e.status===401){ handle401(); return; }
    if(e.status===422){ tbl.innerHTML = `<div class="error-banner">⚠ 正则无效：${esc(e.message)} <button class="btn btn-secondary btn-sm" onclick="loadNodes()">重试</button></div>`; return; }
    tbl.innerHTML = errBanner(e); return;
  }
  renderNodes(data);
}
function renderNodes(data){
  const items = data.items || [];
  const countries = new Set();
  const cname = {}; // country_code → country_name（从已加载节点收集，下拉显示全名）
  items.forEach(n => { if(n.country_code){ countries.add(n.country_code); if(n.country_name) cname[n.country_code]=n.country_name; } });
  const sel = document.getElementById('f-country');
  const known = new Set([...sel.options].map(o => o.value));
  [...countries].sort().forEach(c => { if(!known.has(c)){ const o=document.createElement('option'); o.value=c; o.textContent=flag(c)+' '+(cname[c]||c); sel.appendChild(o); } });

  const tbl = document.getElementById('nodes-table');
  const filtered = nodesState.name_regex||nodesState.country||nodesState.protocol||nodesState.available||nodesState.duplicate;
  if(!items.length){
    tbl.innerHTML = `<div class="state"><div class="ic-big">≡</div><div class="title">无节点</div><div class="desc">${filtered?'无匹配节点，调整筛选':'尚无节点'}</div>${filtered?'<button class="btn btn-secondary btn-sm" onclick="clearNodeFilters()">清除筛选</button>':'<button class="btn btn-primary btn-sm" onclick="nodeCreateModal()">+ 添加节点</button>'}</div>`;
    document.getElementById('nodes-pagination').style.display='none';
    return;
  }
  const rows = items.map(renderNodeRow).join('');
  tbl.innerHTML = `<div class="table-wrap"><table class="tbl-fixed"><colgroup>
    <col style="width:19%"><col style="width:10%"><col style="width:11%"><col style="width:10%"><col style="width:7%"><col style="width:6%"><col style="width:8%"><col style="width:12%"><col style="width:7%"><col style="width:10%"></colgroup>
    <thead><tr>${thSort('name','节点')}${thSort('country','国家')}${thSort('exit_ip','实际 IP')}<th>ASN</th>${thSort('protocol','协议')}${thSort('port','端口')}${thSort('latency','延迟')}${thSort('availability','可用率')}<th>状态</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  document.getElementById('nodes-sub').textContent = `${data.total} 个节点 · 已显示 ${items.length}`;
  renderPagination('nodes-pagination', data, (p) => { nodesState.page = p; loadNodes(); });
}
// thSort 渲染可排序列头（▲/▼ 指示当前列与方向）；sortBy 处理点击：同列翻转方向、切列重置为升序、回到第 1 页。
function thSort(field, label){
  const active = nodesState.sort === field;
  const arrow = active ? (nodesState.dir==='asc'?' ▲':' ▼') : '';
  return `<th class="${active?'th-active':''}" style="cursor:pointer;user-select:none" onclick="sortBy('${field}')">${label}${arrow}</th>`;
}
function sortBy(field){
  if(nodesState.sort === field){ nodesState.dir = (nodesState.dir==='asc'?'desc':'asc'); }
  else { nodesState.sort = field; nodesState.dir = 'asc'; }
  nodesState.page = 1;
  loadNodes();
}
function clearNodeFilters(){
  nodesState.page=1; nodesState.country=''; nodesState.protocol=''; nodesState.name_regex=''; nodesState.available=false; nodesState.duplicate=false;
  document.getElementById('f-country').value=''; document.getElementById('f-protocol').value='';
  document.getElementById('f-status').value=''; document.getElementById('f-regex').value='';
  loadNodes();
}
function nodeRowClass(n){
  if(n.blacklisted) return 'status-black';
  if(!n.initial_check_done) return 'status-warn';
  if(!n.available) return 'status-err';
  if(n.last_latency_ms >= 300) return 'status-warn';
  return 'status-ok';
}
function nodeStatusBadge(n){
  if(n.blacklisted) return '<span class="badge badge-err">● 黑名单</span>';
  if(!n.initial_check_done) return '<span class="badge badge-neutral">● 待测</span>';
  if(!n.available) return '<span class="badge badge-err">● 不可用</span>';
  if(n.last_latency_ms >= 300) return '<span class="badge badge-warn">● 延迟高</span>';
  return '<span class="badge badge-ok">● 可用</span>';
}
// renderNodeRow 渲染单节点 <tr>（含 data-id）。renderNodes 全量渲染与 nodeProbe 就地刷新共用，
// 避免探测成功后 loadNodes() 全量重建导致节点跳位。
function renderNodeRow(n){
  const cls = nodeRowClass(n);
  const badge = nodeStatusBadge(n);
  const lat = n.last_latency_ms >= 0 ? n.last_latency_ms+' ms' : '—';
  const rate = Math.round((n.availability_rate||0)*100);
  const rateColor = rate>=90?'var(--success)':rate>=50?'var(--warning)':'var(--error)';
  // ASN：优先显示组织名（可读），无则显示 AS 号，均无则 —；hover 给完整 AS号·组织名
  const asnCell = n.asn_org ? `<span class="mono asn-cell" title="AS${n.asn||0} · ${esc(n.asn_org)}">${esc(n.asn_org)}</span>` : (n.asn ? `<span class="mono" title="AS${n.asn}">AS${n.asn}</span>` : '<span class="mono">—</span>');
  return `<tr class="${cls}" data-id="${esc(n.stable_id)}">
      <td><div class="node-name" style="font-weight:600" title="${esc(n.name)}">${esc(n.name)}</div><div class="mono">${esc(n.mode||'')} ${n.duplicate_of?'· <span style="color:var(--text-tertiary)">重复</span>':''}</div></td>
      <td>${n.country_code ? `<span class="country" title="${esc(n.country_code)}"><span class="flag">${flag(n.country_code)}</span><span class="code">${esc(n.country_name||n.country_code)}</span></span>` : '<span class="mono">—</span>'}</td>
      <td class="mono">${n.exit_ip ? `<span class="copyable-ip" title="${esc(n.exit_ip)} · 点击复制" onclick="copyText('${esc(n.exit_ip)}','IP')">${esc(n.exit_ip)}</span>` : '<span class="mono">—</span>'}</td>
      <td>${asnCell}</td>
      <td>${n.mode?`<span class="badge badge-neutral">${esc(n.mode)}</span>`:'—'}</td>
      <td class="mono">${n.port||'—'}</td>
      <td class="mono">${lat}</td>
      <td><div class="avail"><div class="avail-bar"><div class="avail-fill" style="width:${Math.max(rate,2)}%;background:${rateColor}"></div></div><span class="avail-num">${rate}%</span></div></td>
      <td>${badge}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="nodeProbe('${esc(n.stable_id)}', this)">探测</button>
        <button class="btn btn-secondary btn-sm" title="复制节点代理链接" onclick="copyNodeProxy(${n.port||0})">复制</button>
        <button class="btn btn-danger btn-sm" data-name="${esc(n.name)}" onclick="nodeDelete('${esc(n.stable_id)}', this)">删除</button>
      </td>
    </tr>`;
}
// copyText 通用复制（节点出口 IP 等）：写剪贴板 + toast
function copyText(text, label){
  navigator.clipboard.writeText(text).then(
    () => toast((label||'已复制')+'：'+text, 'ok'),
    () => toast('复制失败，请手动选中复制', 'err')
  );
}
async function nodeProbe(stableId, btn){
  const orig = btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try {
    const r = await api('/nodes/'+encodeURIComponent(stableId)+'/probe', { method:'POST' });
    // 后端按节点 probeMode 自动选 CF（新节点/未通过，回填国家/IP）或 apple:80（已通过，轻量）。
    // 探测后快照 r.node 已含最新国家，回显让用户确认落地区域。
    const country = r.node && r.node.country_name ? ' · ' + r.node.country_name : '';
    toast('探测成功 · '+r.latency_ms+' ms'+country, 'ok');
    // 就地替换该行（保持列表位置，不重排）；后端响应 r.node 为探测后最新快照
    if(r.node){
      const tr = [...document.querySelectorAll('#nodes-table tr[data-id]')].find(t => t.dataset.id === stableId);
      if(tr) tr.outerHTML = renderNodeRow(r.node);
    }
  } catch(e){ if(e.status===401){ handle401(); return; } toast('探测失败：'+e.message, 'err'); }
  finally { btn.disabled=false; btn.innerHTML=orig; }
}
function nodeCreateModal(){
  openModal(`<h3>添加节点</h3><div class="modal-sub">手动添加单个代理节点</div>
    <div class="form-row"><label>名称</label><input class="input" id="nc-name" placeholder="例：日本-东京01" /></div>
    <div class="form-row"><label>URI</label><input class="input mono" id="nc-uri" placeholder="vmess://... / trojan://..." /></div>
    <div class="form-row"><label>用户名（可选）</label><input class="input" id="nc-username" /></div>
    <div class="form-row"><label>密码（可选）</label><input class="input mono" id="nc-password" /></div>
    <div class="form-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-sm" id="nc-save">添加</button>
    </div>`);
  document.getElementById('nc-save').onclick = async () => {
    const node = {
      name: document.getElementById('nc-name').value.trim(),
      uri: document.getElementById('nc-uri').value.trim(),
      username: document.getElementById('nc-username').value.trim(),
      password: document.getElementById('nc-password').value
    };
    if(!node.uri){ toast('URI 不能为空','warn'); return; }
    if(!node.name) node.name = node.uri.slice(0, 24);
    try {
      await api('/nodes', { method:'POST', body:node });
      toast('节点已添加','ok'); closeModal(); loadNodes();

function nodeDelete(stableId, btn){

/* ===== Subscriptions ===== */
const subsState = { page:1, page_size:20 };
async function loadSubs(){
  const tbl = document.getElementById('subs-table');
  tbl.innerHTML = skeletonTable(['名称','类型','节点数','最近刷新','状态','']);
  const q = new URLSearchParams({ page:subsState.page, page_size:subsState.page_size });
  let data;
  try { data = await api('/subscriptions?'+q.toString()); }
  catch(e){ if(e.status===401){handle401();return;} tbl.innerHTML=errBanner(e); return; }
  const items = data.items || [];
  document.getElementById('subs-sub').textContent = `${data.total!=null?data.total:items.length} 个订阅源`;
  if(!items.length){ tbl.innerHTML = `<div class="state"><div class="ic-big">⟳</div><div class="title">尚无订阅</div><div class="desc">添加订阅源以自动拉取节点</div><button class="btn btn-primary btn-sm" onclick="subCreateModal()">+ 添加订阅</button></div>`; return; }
  const rows = items.map(s => {
    const cls = s.last_refresh_status==='failed' ? 'status-err' : s.last_refresh_status==='running' ? 'status-warn' : 'status-ok';
    const badge = subStatusBadge(s);
    return `<tr class="${cls}">
      <td><div style="font-weight:600">${esc(s.name)}</div><div class="mono">${esc(short(s.url,40))}</div></td>
      <td>${s.type?`<span class="badge badge-neutral">${esc(s.type)}</span>`:'—'}</td>
      <td class="mono">${s.node_count||0}</td>
      <td class="mono">${fmtTime(s.last_refresh_at)}</td>
      <td>${badge}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="subRefreshOne(${s.id}, this)">${s.last_refresh_status==='failed'?'重试':'刷新'}</button>
        <button class="btn btn-secondary btn-sm" data-name="${esc(s.name)}" data-url="${esc(s.url)}" data-type="${esc(s.type||'')}" onclick="subEdit(${s.id}, this)">编辑</button>
        <button class="btn btn-danger btn-sm" data-name="${esc(s.name)}" onclick="subDelete(${s.id}, this)">删除</button>
      </td>
    </tr>`;
  }).join('');
  tbl.innerHTML = `<div class="table-wrap${data.total > subsState.page_size ? ' paginated' : ''}"><table>
    <thead><tr><th>名称</th><th>类型</th><th>节点数</th><th>最近刷新</th><th>状态</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  renderPagination('subs-pagination', data, (p) => { subsState.page = p; loadSubs(); });
}
function subStatusBadge(s){
  const st = s.last_refresh_status;
  if(st === 'success') return '<span class="badge badge-ok">success</span>';
  if(st === 'failed') return `<span class="badge badge-err">failed · ${esc(short(s.last_error||'错误',20))}</span>`;
  if(st === 'running') return '<span class="badge badge-neutral"><span class="spin"></span> running…</span>';
  return '<span class="badge badge-neutral">未刷新</span>';
}
function subCreateModal(){
  openModal(`<h3>添加订阅</h3><div class="modal-sub">从订阅 URL 自动拉取节点</div>
    <div class="form-row"><label>名称</label><input class="input" id="sc-name" placeholder="例：机场A" /></div>
    <div class="form-row"><label>URL</label><input class="input mono" id="sc-url" placeholder="https://example.com/sub" /></div>
    <div class="form-row"><label>类型（可选）</label><select class="input" id="sc-type"><option value="">自动检测</option><option value="base64">base64</option><option value="clash">clash</option><option value="plain">plain</option><option value="singbox">singbox</option></select><div class="form-hint">留空则自动识别</div></div>
    <div class="form-actions"><button class="btn btn-secondary btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" id="sc-save">添加</button></div>`);
  document.getElementById('sc-save').onclick = async () => {
    const body = {
      name: document.getElementById('sc-name').value.trim(),
      url: document.getElementById('sc-url').value.trim(),
      type: document.getElementById('sc-type').value.trim()
    };
    if(!body.url){ toast('URL 不能为空','warn'); return; }
    if(!body.name) body.name = short(body.url, 20);
    try { await api('/subscriptions', { method:'POST', body }); toast('订阅已添加，正在拉取…','ok'); closeModal(); setTimeout(loadSubs, 500); }
    catch(e){ if(e.status===401){handle401();return;} toast('添加失败：'+e.message,'err'); }
  };
}
async function subRefreshOne(id, btn){
  const orig = btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try { await api('/subscriptions/'+id+'/refresh', { method:'POST' }); toast('订阅刷新已触发','ok'); setTimeout(loadSubs, 1500); }
  catch(e){ if(e.status===401){handle401();return;} toast('刷新失败：'+e.message,'err'); }
  finally { btn.disabled=false; btn.innerHTML=orig; }
}
function subDelete(id, btn){
  const name = btn ? btn.dataset.name : '';
  confirmModal('删除订阅', `确定删除订阅「${name}」？\n其来源的节点将被一并移除。`, async () => {
    try { await api('/subscriptions/'+id, { method:'DELETE' }); toast('订阅已删除','ok'); loadSubs(); }
    catch(e){ if(e.status===401){handle401();return;} toast('删除失败：'+e.message,'err'); }
  }, '删除');
}
function subEdit(id, btn){
  const name = btn.dataset.name||'', url = btn.dataset.url||'', type = btn.dataset.type||'';
  openModal(`<h3>编辑订阅</h3><div class="modal-sub">修改后需手动刷新以重新拉取节点</div>
    <div class="form-row"><label>名称</label><input class="input" id="se-name" value="${esc(name)}" /></div>
    <div class="form-row"><label>URL</label><input class="input mono" id="se-url" value="${esc(url)}" /></div>
    <div class="form-row"><label>类型（可选）</label><select class="input" id="se-type"><option value=""${type===''?' selected':''}>自动检测</option><option value="base64"${type==='base64'?' selected':''}>base64</option><option value="clash"${type==='clash'?' selected':''}>clash</option><option value="plain"${type==='plain'?' selected':''}>plain</option><option value="singbox"${type==='singbox'?' selected':''}>singbox</option></select><div class="form-hint">留空则自动识别</div></div>
    <div class="form-actions"><button class="btn btn-secondary btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" id="se-save">保存</button></div>`);
  document.getElementById('se-save').onclick = async () => {
    const body = {
      name: document.getElementById('se-name').value.trim(),
      url: document.getElementById('se-url').value.trim(),
      type: document.getElementById('se-type').value.trim()
    };
    if(!body.url){ toast('URL 不能为空','warn'); return; }
    try { await api('/subscriptions/'+id, { method:'PATCH', body }); toast('订阅已更新','ok'); closeModal(); loadSubs(); }
    catch(e){ if(e.status===401){handle401();return;} toast('更新失败：'+e.message,'err'); }
  };
}

/* ===== Virtual Pools ===== */
let vpListState = { items:[], page:1, pageSize:20 };
// 虚拟池入口链接：有认证带 user:pass@，无认证仅 http://ip:port（无用户名也允许复制入口）
function vpEntryUrl(p){
  if(!appSettings.external_ip || !p.port) return '';
  return p.username
    ? `http://${encodeURIComponent(p.username)}:${encodeURIComponent(p.password||'')}@${appSettings.external_ip}:${p.port}`
    : `http://${appSettings.external_ip}:${p.port}`;
}
async function loadPools(){
  const tbl = document.getElementById('pools-table');
  tbl.innerHTML = skeletonTable(['名称','正则','监听','策略','匹配节点','状态','']);
  await loadAppSettings(); // 取 external_ip 以拼接虚拟池入口链接
  let data;
  try { data = await api('/virtual-pools'); }
  catch(e){ if(e.status===401){handle401();return;} tbl.innerHTML=errBanner(e); return; }
  vpListState.items = Array.isArray(data) ? data : (data.items || []);
  vpListState.page = 1;
  const pg = document.getElementById('vp-pagination'); if(pg) pg.style.display='none';
  if(!vpListState.items.length){ tbl.innerHTML = `<div class="state"><div class="ic-big">▦</div><div class="title">尚无虚拟池</div><div class="desc">新建虚拟池以聚合节点为独立入口</div><button class="btn btn-primary btn-sm" onclick="poolCreateModal()">+ 新建虚拟池</button></div>`; return; }
  renderPoolsPage();
}
function renderPoolsPage(){
  const { items, page, pageSize } = vpListState;
  const total = items.length;
  const pages = Math.max(1, Math.ceil(total/pageSize));
  const p = Math.min(page, pages);
  const slice = items.slice((p-1)*pageSize, p*pageSize);
  const rows = slice.map(pl => {
    const cls = pl.running ? 'status-ok' : 'status-err';
    const entryUrl = vpEntryUrl(pl);
    return `<tr class="${cls}">
      <td style="font-weight:600">${esc(pl.name)}</td>
      <td class="mono">${esc(pl.regular||'—')}</td>
      <td class="mono">:${pl.port||'—'}</td>
      <td>${pl.strategy?`<span class="badge badge-neutral">${esc(strategyLabel(pl.strategy))}</span>`:'—'}</td>
      <td class="mono">${pl.node_count||0}</td>
      <td>${pl.running?'<span class="badge badge-ok">运行中</span>':'<span class="badge badge-err">已停止</span>'}</td>
      <td>
        <input type="hidden" id="pool-entry-${pl.id}" value="${esc(entryUrl)}" />
        <button class="btn btn-secondary btn-sm" onclick="poolViewNodes(${pl.id}, '${esc(pl.name).replace(/'/g,'')}')">查看节点</button>
        ${entryUrl ? `<button class="btn btn-secondary btn-sm" title="复制虚拟池入口链接" onclick="copyLink('pool-entry-${pl.id}','虚拟池入口链接已复制')">复制入口</button>` : ''}
        <button class="btn btn-secondary btn-sm" onclick="poolEditModal(${pl.id})">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="poolDelete(${pl.id}, '${esc(pl.name).replace(/'/g,'')}')">删除</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('pools-table').innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>名称</th><th>正则</th><th>监听</th><th>策略</th><th>匹配节点</th><th>状态</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  renderPagination('vp-pagination', { total, page:p, page_size:pageSize }, (np) => { vpListState.page = np; renderPoolsPage(); });
}

const REGION_ORDER = ['东亚','东南亚','南亚','中亚','中东','西欧','北欧','南欧','东欧','北美','中美','南美','大洋洲','北非','西非','中非','东非','南非'];
// 大洲聚合：18 个细分区域 → 6 大洲，用于弹窗顶部"已探测节点分布"汇总大卡片。
const CONTINENT_OF = {'东亚':'亚洲','东南亚':'亚洲','南亚':'亚洲','中亚':'亚洲','中东':'亚洲','西欧':'欧洲','北欧':'欧洲','南欧':'欧洲','东欧':'欧洲','北美':'北美','中美':'北美','南美':'南美','大洋洲':'大洋洲','北非':'非洲','西非':'非洲','中非':'非洲','东非':'非洲','南非':'非洲'};
const CONTINENT_ORDER = ['亚洲','欧洲','北美','南美','大洋洲','非洲'];
async function ensureCountryMap(){
  if(COUNTRY_MAP) return COUNTRY_MAP;
  try {
    const s = await api('/stats');
    const cd = s.country_distribution || [];
    COUNTRY_MAP = {};
    cd.forEach(c => { if(c.country_code) COUNTRY_MAP[c.country_code] = { name: c.country_name||c.country_code, code: c.country_code, count: c.count||0 }; });
  } catch(e){ COUNTRY_MAP = {}; }
  return COUNTRY_MAP;
}
function countryName(code){ return COUNTRY_NAME[code] || code; }
// 打开国家选择弹窗。opts: { included:[], excluded:[], allowExclude:bool, onApply(inc, exc) }。叠加在当前 modal 之上，关闭仅移除自身。
function openCountryPicker(opts){
  const included = new Set(opts.included || []);
  const excluded = new Set(opts.excluded || []);
  const allowExclude = opts.allowExclude !== false;
  let tab = 'include';
  const root = document.getElementById('modal-root');
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  const box = document.createElement('div');
  box.className = 'modal country-picker';
  box.innerHTML = `
    <h3>选择国家</h3>
    <div class="modal-sub">全部国家/地区 · 数字为已探测节点数（0 表示暂无，可预先配置）${allowExclude?' · 切到「排除」页可排除指定地区':''}</div>
    <div class="country-picker-search"><input class="input" id="cp-search" placeholder="搜索国家名或代码…" autocomplete="off" /></div>
    ${allowExclude ? `<div class="cp-tabs">
      <div class="cp-tab active" data-tab="include">包含 <span id="cp-inc-n">0</span></div>
      <div class="cp-tab" data-tab="exclude">排除 <span id="cp-exc-n">0</span></div>
    </div>` : ''}
    <div class="country-picker-body" id="cp-body"></div>
    <div class="form-actions">
      <span class="cp-count-label" id="cp-count"></span>
      <button class="btn btn-secondary btn-sm" id="cp-cancel">取消</button>
      <button class="btn btn-primary btn-sm" id="cp-apply">应用</button>
    </div>`;
  back.appendChild(box);
  root.appendChild(back);
  const close = () => back.remove();
  back.addEventListener('click', e => { if(e.target === back) close(); });
  document.getElementById('cp-cancel').onclick = close;
  const updateCount = () => {
    const n1 = document.getElementById('cp-inc-n');
    const n2 = document.getElementById('cp-exc-n');
    if(n1) n1.textContent = included.size;
    if(n2) n2.textContent = excluded.size;
    document.getElementById('cp-count').textContent = (included.size||excluded.size) ? ('包含 '+included.size+' · 排除 '+excluded.size) : '';
  };
  const render = (kw) => {
    const counts = COUNTRY_MAP || {};
    const k = (kw||'').trim().toLowerCase();
    let items = COUNTRY_LIST.map(c => ({ code:c.c, name:c.n, region:c.r, count:(counts[c.c] && counts[c.c].count) || 0 }));
    if(k) items = items.filter(c => c.name.toLowerCase().includes(k) || c.code.toLowerCase().includes(k));
    // cp-item 模板：汇总区与分区共用，选中状态由 included/excluded 决定
    const itemHTML = (c) => {
      const inc = included.has(c.code), exc = excluded.has(c.code);
      const cls = inc?' inc':(exc?' exc':'');
      const mark = inc?'✓':(exc?'✕':'');
      return `<div class="cp-item${cls}" data-code="${esc(c.code)}"><span class="flag">${flag(c.code)}</span><span class="cp-name">${esc(c.name)}</span><span class="cp-count">${c.count}</span><span class="cp-mark">${mark}</span></div>`;
    };
    // 顶部汇总：仅无搜索关键词时显示，已探测节点(count>0)按大洲聚合为大卡片，内含国家小卡片
    let overview = '';
    if(!k){
      const probed = items.filter(c => c.count > 0);
      const conts = {};
      probed.forEach(c => { const ct = CONTINENT_OF[c.region] || '其他'; (conts[ct] = conts[ct] || []).push(c); });
      Object.keys(conts).forEach(ct => conts[ct].sort((a,b) => (b.count - a.count) || a.name.localeCompare(b.name,'zh')));
      const order = CONTINENT_ORDER.filter(ct => conts[ct]);
      if(conts['其他']) order.push('其他');
      if(order.length){
        overview = '<div class="cp-overview"><div class="cp-overview-title">已探测节点分布 · 按大洲</div>' +
          order.map(ct => {
            const cs = conts[ct];
            const total = cs.reduce((s,c) => s + c.count, 0);
            return `<div class="cp-continent"><div class="cp-continent-head"><span class="cp-continent-name">${esc(ct)}</span><span class="cp-continent-total">${total} 节点 · ${cs.length} 地区</span></div><div class="cp-grid">${cs.map(itemHTML).join('')}</div></div>`;
          }).join('') + '</div>';
      }
    }
    const groups = {};
    items.forEach(c => { const r = c.region || '其他'; (groups[r] = groups[r] || []).push(c); });
    Object.keys(groups).forEach(r => groups[r].sort((a,b) => (b.count - a.count) || a.name.localeCompare(b.name,'zh')));
    const regions = REGION_ORDER.filter(r => groups[r]);
    if(groups['其他']) regions.push('其他');
    const body = document.getElementById('cp-body');
    const listHTML = regions.length ? regions.map(r =>
      `<div class="cp-region"><div class="cp-region-title">${esc(r)}</div><div class="cp-grid">${groups[r].map(itemHTML).join('')}</div></div>`
    ).join('') : '<div class="state" style="padding:16px"><div class="desc">无匹配国家</div></div>';
    body.innerHTML = overview + listHTML;
    body.querySelectorAll('.cp-item').forEach(el => {
      el.onclick = () => {
        const code = el.dataset.code;
        if(allowExclude && tab === 'exclude'){
          if(excluded.has(code)){ excluded.delete(code); }
          else { excluded.add(code); included.delete(code); }
        } else {
          if(included.has(code)){ included.delete(code); }
          else { included.add(code); excluded.delete(code); }
        }
        // 同步所有同 code 的 cp-item 视觉（汇总区与分区可能并存同一国家）
        body.querySelectorAll('.cp-item[data-code="'+CSS.escape(code)+'"]').forEach(x => {
          const inc = included.has(code), exc = excluded.has(code);
          x.className = 'cp-item' + (inc?' inc':(exc?' exc':''));
          x.querySelector('.cp-mark').textContent = inc?'✓':(exc?'✕':'');
        });
        updateCount();
      };
    });
  };
  if(allowExclude){
    document.querySelectorAll('.cp-tab').forEach(t => {
      t.onclick = () => {
        tab = t.dataset.tab;
        document.querySelectorAll('.cp-tab').forEach(x => x.classList.remove('active','exc'));
        t.classList.add('active');
        if(tab === 'exclude') t.classList.add('exc');
      };
    });
  }
  document.getElementById('cp-search').oninput = (e) => render(e.target.value);
  document.getElementById('cp-apply').onclick = () => { opts.onApply([...included], [...excluded]); close(); };
  render('');
  updateCount();
  ensureCountryMap().then(() => render(document.getElementById('cp-search').value));
  document.getElementById('cp-search').focus();
}
// 通用国家字段（chip 展示 + 选择按钮）。opts.exclude 启用排除集合（虚拟池用）。
function makeCountryField(chipsId, opts={}){
  const exclude = !!opts.exclude;
  let included = [], excluded = [];
  const render = () => {
    const box = document.getElementById(chipsId);
    if(!box) return;
    const chips = [];
    included.forEach(c => chips.push(`<span class="chip chip-inc"><span class="flag">${flag(c)}</span><span>${esc(countryName(c))}</span><button type="button" class="chip-x" data-code="${esc(c)}" data-set="inc" title="移除">×</button></span>`));
    if(exclude) excluded.forEach(c => chips.push(`<span class="chip chip-exc"><span class="flag">${flag(c)}</span><span>${esc(countryName(c))}</span><button type="button" class="chip-x" data-code="${esc(c)}" data-set="exc" title="移除">×</button></span>`));
    box.innerHTML = chips.length ? chips.join('') : '<span class="chip-empty">未选择（匹配所有国家）</span>';
    box.querySelectorAll('.chip-x').forEach(b => b.onclick = () => {
      if(b.dataset.set === 'exc') excluded = excluded.filter(c => c !== b.dataset.code);
      else included = included.filter(c => c !== b.dataset.code);
      render();
    });
  };
  return {
    init(cfg){ cfg = cfg || {}; included = [...(cfg.country_codes||[])]; excluded = [...(cfg.excluded_country_codes||[])]; render(); ensureCountryMap().then(render); },
    pick(){ openCountryPicker({ included, excluded, allowExclude: exclude, onApply: (inc, exc) => { included=inc; excluded=exc; render(); } }); },
    get(){ const r = { country_codes: included }; if(exclude) r.excluded_country_codes = excluded; return r; }
  };
}

// 分配虚拟池端口：调 next-port 预览一个可用端口回填到只读字段（留空提交则后端自动分配）
async function allocVpPort(){
  try { const r = await api('/virtual-pools/next-port'); document.getElementById('vp-port').value = r.port; }
  catch(e){ if(e.status===401){handle401();return;} toast('分配端口失败：'+e.message,'err'); }
}
function poolReadForm(){
  const port = parseInt(document.getElementById('vp-port').value, 10);
  const maxlat = parseInt(document.getElementById('vp-maxlat').value, 10);
  const cc = vpCountryField ? vpCountryField.get() : {};
  const body = {
    name: document.getElementById('vp-name').value.trim(),
    regular: document.getElementById('vp-regular').value.trim(),
    address: document.getElementById('vp-address').value.trim() || '0.0.0.0',
    port: port || 0,
    username: document.getElementById('vp-username').value.trim(),
    password: document.getElementById('vp-password').value,
    strategy: document.getElementById('vp-strategy').value,
    country_codes: cc.country_codes || [],
    excluded_country_codes: cc.excluded_country_codes || []
  };
  if(maxlat) body.max_latency_ms = maxlat;
  // weighted 策略必填两个权重（>0）；其余策略不带（后端忽略）
  if(body.strategy === 'weighted'){
    const latw = parseFloat(document.getElementById('vp-latw').value);
    const availw = parseFloat(document.getElementById('vp-availw').value);
    if(!(latw > 0) || !(availw > 0)){ body._weightError = '智能加权需填写延迟权重和可用率权重（均 >0）'; }
    else { body.latency_weight = latw; body.availability_weight = availw; }
  }
  return body;
}

function renderVpnModal(){
  const { name, items, page, pageSize } = vpnState;
  const total = items.length;
  const pages = Math.max(1, Math.ceil(total/pageSize));
  const p = Math.min(page, pages);
  const slice = items.slice((p-1)*pageSize, p*pageSize);
  const rows = slice.length ? slice.map(n => {
    const asn = n.asn_org ? `<span class="mono asn-cell" title="AS${n.asn||0} · ${esc(n.asn_org)}">${esc(n.asn_org)}</span>` : (n.asn ? `<span class="mono" title="AS${n.asn}">AS${n.asn}</span>` : '<span class="mono">—</span>');
    return `<tr class="${nodeRowClass(n)}">
      <td><div style="font-weight:600">${esc(n.name)}</div><div class="mono">${esc(n.mode||'')}</div></td>
      <td>${n.country_code?`<span class="country" title="${esc(n.country_code)}"><span class="flag">${flag(n.country_code)}</span><span class="code">${esc(n.country_name||n.country_code)}</span></span>`:'—'}</td>
      <td>${asn}</td>
      <td class="mono">${n.last_latency_ms>=0?n.last_latency_ms+' ms':'—'}</td>
      <td>${nodeStatusBadge(n)}</td></tr>`;
  }).join('') : '';
  openModal(`<h3>${esc(name)} · 匹配节点</h3><div class="modal-sub">${total} 个节点</div>
    ${total ? `<div class="table-wrap"><table><thead><tr><th>节点</th><th>国家</th><th>ASN</th><th>延迟</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="pagination" id="vpn-pagination" style="display:none"></div>` : stateInline('正则无匹配节点')}
    <div class="form-actions"><button class="btn btn-secondary btn-sm" onclick="closeModal()">关闭</button></div>`, {extraWide:true});
  if(total) renderPagination('vpn-pagination', { total, page:p, page_size:pageSize }, (np) => { vpnState.page = np; renderVpnModal(); });
}

const tokensState = { page:1, page_size:20 };
async function loadSubTokens(){
  const tbl = document.getElementById('subtokens-table');
  tbl.innerHTML = skeletonTable(['名称','过滤','代理列表 URL','最近使用','']);
  const q = new URLSearchParams({ page:tokensState.page, page_size:tokensState.page_size });
  let data; try { data = await api('/subscribe-tokens?'+q.toString()); }
  catch(e){ if(e.status===401){handle401();return;} if(e.status===501){ tbl.innerHTML=stateInline('凭证功能未启用'); return; } tbl.innerHTML=errBanner(e); return; }
  const items = data.items || [];
  if(!items.length){ document.getElementById('subtokens-pagination').style.display='none'; tbl.innerHTML = `<div class="state" style="padding:24px"><div class="desc">尚无订阅 Token</div><button class="btn btn-primary btn-sm" onclick="subTokenCreateModal()">+ 新建 Token</button></div>`; return; }
  const rows = items.map(t => {
    const f = t.filters || {};
    const fParts = [];
    if((f.country_codes||[]).length) fParts.push(f.country_codes.join(','));
    if((f.protocols||[]).length) fParts.push(f.protocols.join(','));
    if(f.name_regex) fParts.push('/'+f.name_regex+'/');
    const fStr = fParts.length ? fParts.join(' / ') : '无过滤';
    const url = '/sub/'+t.token_prefix+'…';
    return `<tr>
      <td style="font-weight:600">${esc(t.name)}</td>
      <td class="mono">${esc(fStr)}</td>
      <td class="mono"><span class="desc">${esc(url)}</span></td>
      <td class="mono">${fmtTime(t.last_used_at)}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="revealSubToken(${t.id})">复制</button>
        <button class="btn btn-danger btn-sm" data-name="${esc(t.name)}" onclick="subTokenDelete(${t.id}, this)">删除</button>
      </td>
    </tr>`;
  }).join('');
  tbl.innerHTML = `<div class="table-wrap${data.total > tokensState.page_size ? ' paginated' : ''}"><table><thead><tr><th>名称</th><th>过滤</th><th>代理列表 URL</th><th>最近使用</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  renderPagination('subtokens-pagination', data, (p) => { tokensState.page = p; loadSubTokens(); });
}

function secretModal(title, name, secret, secondary, warn, linkUrl){

function copySecret(){
  const txt = document.getElementById('sec-secret').textContent;
  navigator.clipboard.writeText(txt).then(() => toast('已复制到剪贴板','ok'), () => toast('复制失败，请手动选择','warn'));
}
// copyText 通用复制 + 自定义 toast；copyLink 从隐藏 input 读 value（避开闭包/转义）。
function copyText(txt, msg){
  navigator.clipboard.writeText(txt).then(() => toast(msg||'已复制到剪贴板','ok'), () => toast('复制失败，请手动选择','warn'));
}
function copyLink(elId, msg){
  const el = document.getElementById(elId);
  if(el) copyText(el.value, msg||'订阅链接已复制');
}
// copyNodeProxy 拼节点端口代理链接 http://user:pwd@external_ip:port（点击时按需加载 settings）。
async function copyNodeProxy(port){
  if(!appSettings.external_ip) await loadAppSettings();
  const s = appSettings;
  if(!s.external_ip){ toast('未获取到 external_ip，请稍后再试','warn'); return; }
  if(!s.proxy_username && !s.proxy_password){ toast('当前模式无统一代理凭证，无法生成链接','warn'); return; }
  // pool 模式节点共享 listener 端口（节点 port 是分配位次，非监听口）→ 用 listener_port；
  // port=0（未分配）同样回退 listener_port。hybrid/multi-port 用节点独立端口。
  const eff = (s.mode === 'pool' || !port) ? s.listener_port : port;
  if(!eff){ toast('未获取到监听端口，请稍后再试','warn'); return; }
  const url = `http://${encodeURIComponent(s.proxy_username)}:${encodeURIComponent(s.proxy_password)}@${s.external_ip}:${eff}`;
  copyText(url, '节点代理链接已复制');
}
function onSecretSaved(){ closeModal(); toast('请妥善保管已复制的明文','ok'); }
// revealAPIKey 点复制时调 /api-keys/{id}/plain 取明文（session 鉴权），新浏览器登录即可用。
// plain 接口是本地 db 查询+解密（毫秒级），不加 loading 动效，避免按钮宽度变化导致行闪动。
async function revealAPIKey(id){

}
async function revealSubToken(id){
  try {

    if(!r.plain){ toast('未找到明文','warn'); return; }
    copyText(location.origin + '/sub/' + r.plain, '订阅链接已复制');
  } catch(e){ if(e.status===401){handle401();return;} toast('复制失败：'+e.message,'err'); }
}

/* ===== Alerts ===== */
async function loadAlerts(){
  const body = document.getElementById('alerts-body');
  body.innerHTML = `<div class="card" style="padding:20px"><div class="skeleton" style="height:40px"></div></div>`;
  if(!appSettings.mode) await loadAppSettings(); // 按模式选节点告警的跳转锚点（pool→代理池入口；hybrid/multi-port→多端口入口）
  let data; try { data = await api('/alerts'); }
  catch(e){ if(e.status===401){handle401();return;} body.innerHTML=errBanner(e); return; }
  if(data && data.enabled === false){
    body.innerHTML = `<div class="state"><div class="ic-big" style="color:var(--text-tertiary)">⊘</div><div class="title">安全告警已关闭</div><div class="desc">在「设置」页开启扫描</div></div>`;
    return;
  }
  const items = (data && data.alerts) || [];
  if(!items.length){
    body.innerHTML = `<div class="state"><div class="ic-big" style="color:var(--success);opacity:1">✓</div><div class="title">无安全告警</div><div class="desc">所有代理入口均已设置认证</div></div>`;
    return;
  }
  const critical = items.filter(a => a.level === 'critical').length;
  const warn = `<div class="warn-strip">⚠ 检测到 ${items.length} 项安全告警${critical ? `（其中 ${critical} 项严重）` : ''}，建议尽快处理。</div>`;
  const list = items.map(a => {
    const isPool = a.code === 'empty_pool_auth' || a.code === 'weak_pool_auth';
    const color = a.level === 'critical' ? 'var(--danger)' : 'var(--warning)';
    // 节点密码告警：按运行模式定位到对应入口块（pool→代理池入口；hybrid/multi-port→多端口入口）
    const nodeEntry = appSettings.mode === 'pool' ? 'pool' : 'multi_port';
    const onclickAttr = isPool ? `switchView('pools')` : `switchView('settings','${nodeEntry}')`;
    const btn = isPool ? '去虚拟池设置' : '去设置入口密码';
    return `<div class="alert-item">
      <div class="summary-ic" style="color:${color}">${a.level === 'critical' ? '⛔' : '⚠'}</div>
      <div style="flex:1">
        <div style="font-weight:600">${esc(a.message || '')}</div>
        <div class="mono">code: ${esc(a.code || '')}${a.ref ? ' · ref: ' + esc(a.ref) : ''}</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="${onclickAttr}">${btn}</button>
    </div>`;
  }).join('');
  body.innerHTML = warn + `<div class="card" style="padding:0">${list}</div>`;
}

/* ===== 公共渲染 ===== */
function skeletonTable(headers){
  const skel = `<div class="skeleton" style="margin:4px 0"></div>`;
  const rows = Array.from({length:5}).map(() => `<tr><td>${skel}</td>${headers.slice(1).map(()=>`<td>${skel}</td>`).join('')}</tr>`).join('');
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function errBanner(e){
  return `<div class="error-banner">⚠ ${esc(e.message)} <button class="btn btn-secondary btn-sm" onclick="switchView(location.hash.slice(1)||'dashboard')">重试</button></div>`;
}
function renderPagination(elId, data, onPage){
  const el = document.getElementById(elId);
  const total = data.total||0, page = data.page||1, size = data.page_size||20;
  const pages = Math.max(1, Math.ceil(total/size));
  if(total <= size){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = `<span>共 ${total} 条 · 第 ${page}/${pages} 页</span>
    <div class="pager">
      <button class="btn btn-secondary btn-sm" ${page<=1?'disabled':''} data-p="${page-1}">‹</button>
      <button class="btn btn-secondary btn-sm" ${page>=pages?'disabled':''} data-p="${page+1}">›</button>
    </div>`;
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if(!b.disabled) onPage(parseInt(b.dataset.p,10)); });
}
function updateNavStatus(avail, total, hasIssue){
  const txt = document.getElementById('nav-status-text');
  const dot = document.querySelector('#nav-status .dot');
  txt.textContent = `${avail} / ${total} 节点可用`;
  dot.className = 'dot' + (hasIssue ? ' warn' : '');
}

    </div>
    <div style="margin-top:16px;max-width:680px"><button class="btn btn-primary" id="set-save">保存设置</button></div>`;
  document.getElementById('set-save').onclick = saveSettings;
  // 跨视图锚点（告警→设置页某入口块）：滚动定位 + 闪烁高亮，用后即清
  if(viewAnchor){
    const card = document.getElementById(viewAnchor === 'pool' ? 'set-pool-card' : 'set-mp-card');
    if(card){
      card.scrollIntoView({behavior:'smooth', block:'center'});
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 3000);
    }
    viewAnchor = '';
  }
}
async function saveSettings(){
  const external_ip = document.getElementById('set-external-ip').value.trim();
  const alert_enabled = document.getElementById('set-alert-enabled').checked;
  const skip_cert_verify = document.getElementById('set-skip-cert').checked;
  const body = { external_ip, alert_enabled, skip_cert_verify };
  // 仅在入口凭证实际变更时发送对应组，避免未改也触发内核重建；
  // 按设置页当前渲染的入口组取值（未渲染的元素为 null，跳过）。
  let entryChanged = false;
  const pu = document.getElementById('set-pool-user');
  const pp = document.getElementById('set-pool-pwd');
  const mu = document.getElementById('set-mp-user');
  const mpwd = document.getElementById('set-mp-pwd');
  if(pu && pu.value !== settingsOrig.pool_username){ body.pool_username = pu.value; entryChanged = true; }
  if(pp && pp.value !== settingsOrig.pool_password){ body.pool_password = pp.value; entryChanged = true; }
  if(mu && mu.value !== settingsOrig.multi_port_username){ body.multi_port_username = mu.value; entryChanged = true; }
  if(mpwd && mpwd.value !== settingsOrig.multi_port_password){ body.multi_port_password = mpwd.value; entryChanged = true; }
  const btn = document.getElementById('set-save');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    const r = await api('/settings', { method:'PUT', body });
    toast(r && r.message ? r.message : '设置已更新', 'ok');
    await loadAppSettings();
    if(entryChanged){
      toast('入口凭证已更新，内核正在重建…', 'warn');
    }
  } catch(e){
    if(e.status===401){handle401();return;}
    toast(e.message || '保存失败', 'err');
  } finally {
    btn.disabled = false; btn.textContent = '保存设置';
  }
}
async function bootApp(){
  loadAppSettings(); // 后台预热，不阻塞首屏
  document.getElementById('logout-btn').style.display = session.hasPassword ? 'inline-flex' : 'none';
  const initial = (location.hash || '#dashboard').replace('#','');
  switchView(initial in VIEW_LOADERS ? initial : 'dashboard');
  setInterval(() => {
    if(location.hash === '#dashboard' || location.hash === '') loadDashboard().catch(()=>{});
  }, 30000);
}

async function init(){
  document.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => switchView(n.dataset.nav)));
  document.getElementById('login-btn').onclick = doLogin;
  document.getElementById('login-password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('logout-btn').onclick = doLogout;
  document.getElementById('dash-refresh').onclick = () => loadDashboard().catch(e=>{ if(e.status!==401) toast(e.message,'err'); });
  document.getElementById('dash-probe').onclick = async () => {
    try { await api('/probe/all', { method:'POST' }); toast('全节点探测已启动（异步）','ok'); setTimeout(loadDashboard, 3000); }
    catch(e){ if(e.status===401){handle401();return;} toast('探测触发失败：'+e.message,'err'); }
  };
  document.getElementById('subs-refresh-all').onclick = async () => {
    try { await api('/subscriptions/refresh', { method:'POST' }); toast('全量刷新已触发','ok'); setTimeout(loadSubs, 1500); }
    catch(e){ if(e.status===401){handle401();return;} toast('刷新失败：'+e.message,'err'); }
  };
  document.getElementById('alerts-refresh').onclick = () => loadAlerts();
  document.getElementById('sidebar-toggle').onclick = toggleSidebar;

  const authed = await checkAuth().catch(() => false);
  if(authed){ hideLogin(); await bootApp(); }
  else { showLogin(); }
}
init();
</script>
</body>
