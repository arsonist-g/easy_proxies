<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订阅 · Easy Proxies</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body data-page="subs">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <button class="btn btn-secondary btn-sm mobile-toggle" onclick="toggleSidebar()">☰</button>
        <h1 style="display:inline">订阅</h1>
        <div class="sub" id="subs-sub">订阅源</div>
      </div>
      <div class="page-actions">
        <!-- P3：去掉单订阅刷新按钮，仅保留全量刷新（逻辑上都要重启内核） -->
        <button class="btn btn-secondary btn-sm" id="subs-refresh-all">↻ 全量刷新</button>
        <button class="btn btn-primary btn-sm" onclick="subCreateModal()">+ 添加订阅</button>
      </div>
    </div>
    <div id="subs-table"></div>
    <div class="pagination" id="subs-pagination" style="display:none"></div>
  </main>
</div>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/modal.js"></script>
<script src="/assets/js/pagination.js"></script>
<script src="/assets/js/pages/subs.js"></script>
</body>
</html>
